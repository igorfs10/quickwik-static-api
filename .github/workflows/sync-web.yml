name: Sync Static API to web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-web-branch
  cancel-in-progress: false

jobs:
  sync-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f games_manifest.json ]; then
            echo "Error: games_manifest.json not found." >&2
            exit 1
          fi

          if [ ! -d games ]; then
            echo "Error: games/ directory not found." >&2
            exit 1
          fi

          jq empty games_manifest.json
          jq -e '
            (.updated_at | type == "string") and
            (.games | type == "array" and length > 0) and
            ([.games[] | .id] | length == (unique | length)) and
            all(.games[]; (.id | type == "string") and (.title | type == "string") and (.icon | type == "string") and (.url == ("games/" + .id + ".json")) and (.updated_at | type == "string"))
          ' games_manifest.json >/dev/null

          while IFS= read -r -d '' file; do
            echo "Validating ${file}"
            jq empty "${file}"
            base_id="$(basename "${file}" .json)"
            jq -e --arg bid "${base_id}" '
              (.id == $bid) and
              (.title | type == "string" and length > 0) and
              (.icon | type == "string" and length > 0) and
              (.updated_at | type == "string" and test("Z$")) and
              (.sources | type == "array" and length > 0) and
              (.process_keywords | type == "array" and length > 0) and
              (.categories | type == "array" and length >= 2 and .[0].id == "all") and
              (.entries | type == "array" and length > 0) and
              ([.entries[] | .id] | length == (unique | length))
            ' "${file}" >/dev/null
            jq -e --arg bid "${base_id}" 'any(.games[]; .id == $bid)' games_manifest.json >/dev/null
          done < <(find games -type f -name '*.json' -print0)

      - name: Prepare clean payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/web-dist
          mkdir -p /tmp/web-dist
          cp games_manifest.json /tmp/web-dist/
          cp -R games /tmp/web-dist/

      - name: Sync and push to web branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/web-repo

          if ! git clone --depth 1 --branch web "${REPO_URL}" /tmp/web-repo; then
            echo "Branch web not found on remote. Initializing orphan web branch."
            git init /tmp/web-repo
            git -C /tmp/web-repo remote add origin "${REPO_URL}"
            git -C /tmp/web-repo checkout --orphan web
          fi

          rsync -a --delete --exclude='.git' /tmp/web-dist/ /tmp/web-repo/

          cd /tmp/web-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish to web."
            exit 0
          fi

          git commit -m "sync: publish static api from ${GITHUB_SHA::7}"
          git push origin web
